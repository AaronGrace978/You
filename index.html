<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>You — a presence that sees you</title>
    <meta
      name="description"
      content="A relational AI presence that sees you — not as a problem to solve, but as a person to hear."
    />

    <!-- Status-bar tint — kept in sync with the in-app theme at runtime (App.tsx).
         No prefers-color-scheme media here: it must follow the app's theme, not the
         system's, or the status bar shows a mismatched line above the content. -->
    <meta name="theme-color" content="#161618" />

    <!-- Paint the viewport immediately — prevents white gaps in installed PWAs -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #161618;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background-color: #faf9f5;
      }
    </style>
    <script>
      (function () {
        var COLORS = { dark: "#161618", light: "#faf9f5" };
        var theme = "dark";
        try {
          var raw = localStorage.getItem("you-app-state");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.state && parsed.state.theme) theme = parsed.state.theme;
          }
        } catch (_) {}
        var color = COLORS[theme] || COLORS.dark;
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        root.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.remove();
        meta = document.createElement("meta");
        meta.name = "theme-color";
        meta.content = color;
        document.head.appendChild(meta);
        var cs = document.querySelector('meta[name="color-scheme"]');
        if (!cs) {
          cs = document.createElement("meta");
          cs.name = "color-scheme";
          document.head.appendChild(cs);
        }
        cs.content = theme === "dark" ? "dark" : "light";
      })();
    </script>

    <!-- Installable on phones (Add to Home Screen) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="You" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:ital,opsz,wght@0,14..32,300..600;1,14..32,300..600&family=Karla:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
